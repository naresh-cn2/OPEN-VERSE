name: Linux Hermes Agent Package

on:
  workflow_dispatch:
    inputs:
      confirm_build:
        description: 'Type "build" to build Hermes Agent Linux package.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Hermes Agent for Linux
    if: github.event.inputs.confirm_build == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: open-verse

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Hermes Agent installer (non-interactive)
        working-directory: open-verse/sources/hermes-agent
        env:
          HERMES_HOME: /tmp/hermes-home
          HERMES_INSTALL_DIR: /tmp/hermes-agent
        run: |
          bash scripts/install.sh --non-interactive --skip-browser --skip-computer-use --hermes-home /tmp/hermes-home --install-dir /tmp/hermes-agent

      - name: Verify Hermes Agent installation
        run: |
          if [ ! -f /tmp/hermes-agent/cli.py ]; then
            echo "❌ Hermes Agent cli.py not found in /tmp/hermes-agent"
            exit 1
          fi
          ls -la /tmp/hermes-agent/ | head -30

      - name: Package Hermes Agent ZIP
        run: |
          cd /tmp/hermes-agent
          zip -r /tmp/Hermes-Agent-0.2.8-linux.zip .
          ls -la /tmp/Hermes-Agent-0.2.8-linux.zip

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-linux
          path: /tmp/Hermes-Agent-0.2.8-linux.zip
          retention-days: 90
