name: Linux Hermes Agent Package

on:
  workflow_dispatch:
    inputs:
      confirm_build:
        description: 'Type "build" to build Hermes Agent Linux package.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Hermes Agent for Linux
    if: github.event.inputs.confirm_build == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: open-verse

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Copy Hermes Agent source
        run: cp -r open-verse/sources/hermes-agent/* hermes-agent-pkg/

      - name: Install Hermes Agent dependencies
        working-directory: hermes-agent-pkg
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .

      - name: Create Linux launcher scripts
        working-directory: hermes-agent-pkg
        run: |
          mkdir -p bin
          printf '#!/bin/bash\nHERMES_HOME="$(cd "$(dirname "$0")/.." && pwd)"\nHERMES_PYTHON="$HERMES_HOME/.venv/bin/python"\nexec "$HERMES_PYTHON" "$HERMES_HOME/cli.py" "$@"\n' > bin/hermes
          printf '#!/bin/bash\nHERMES_HOME="$(cd "$(dirname "$0")/.." && pwd)"\nHERMES_PYTHON="$HERMES_HOME/.venv/bin/python"\nexec "$HERMES_PYTHON" "$HERMES_HOME/cli.py" gateway "$@"\n' > bin/hermes-gateway
          chmod +x bin/hermes bin/hermes-gateway

      - name: Verify Hermes Agent installation
        working-directory: hermes-agent-pkg
        run: |
          test -f cli.py || { echo "cli.py not found"; exit 1; }
          test -d .venv || { echo "venv not found"; exit 1; }
          ls -1

      - name: Package Hermes Agent ZIP
        working-directory: hermes-agent-pkg
        run: zip -r ../Hermes-Agent-0.2.8-linux.zip .

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-linux
          path: Hermes-Agent-0.2.8-linux.zip
          retention-days: 90
