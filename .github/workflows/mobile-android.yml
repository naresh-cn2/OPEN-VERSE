name: Mobile Android Build & Delivery

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Build Mobile Webview Assets
        run: |
          cd mobile
          bun install --frozen-lockfile || bun install
          bun run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/

      - name: Make Gradle Wrapper Executable
        run: chmod +x mobile/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd mobile/android
          ./gradlew assembleDebug --no-daemon

      - name: Build Android Release AAB
        run: |
          cd mobile/android
          ./gradlew bundleRelease --no-daemon

      - name: Rename and Prepare Deliverables
        run: |
          mkdir -p mobile/artifacts
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/artifacts/open-verse-mobile-v0.2.0-debug.apk
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk mobile/artifacts/open-verse-mobile.apk
          if [ -f mobile/android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp mobile/android/app/build/outputs/bundle/release/app-release.aab mobile/artifacts/open-verse-mobile-v0.2.0.aab
          fi
          cd mobile/artifacts
          sha256sum open-verse-mobile.apk > open-verse-mobile.apk.sha256
          cat open-verse-mobile.apk.sha256

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-verse-android-apk
          path: mobile/artifacts/open-verse-mobile.apk
          if-no-files-found: error

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-verse-android-aab
          path: mobile/artifacts/*.aab
          if-no-files-found: ignore

      - name: Publish to Latest Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release upload desktop-latest mobile/artifacts/open-verse-mobile.apk --clobber
            gh release upload desktop-latest mobile/artifacts/open-verse-mobile.apk.sha256 --clobber
            echo "Uploaded open-verse-mobile.apk to desktop-latest release"
          fi
