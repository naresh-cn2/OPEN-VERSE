name: Mobile Android Build & Delivery

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'desktop/apps/examples/desktop-app/webview/**'
      - '.github/workflows/mobile-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Ensure Canonical Assets Synced
        run: |
          mkdir -p mobile/android/app/src/main/assets
          if [ -d "desktop/apps/examples/desktop-app/webview/out" ]; then
            cp -r desktop/apps/examples/desktop-app/webview/out/* mobile/android/app/src/main/assets/
          fi

      - name: Make Gradle Wrapper Executable
        run: chmod +x mobile/android/gradlew

      - name: Build Android Release APK & AAB
        run: |
          cd mobile/android
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Rename and Prepare Deliverables
        run: |
          mkdir -p mobile/artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk mobile/artifacts/open-verse-mobile-v0.2.0.apk
          cp mobile/android/app/build/outputs/apk/release/app-release.apk mobile/artifacts/open-verse-mobile.apk
          if [ -f mobile/android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp mobile/android/app/build/outputs/bundle/release/app-release.aab mobile/artifacts/open-verse-mobile-v0.2.0.aab
            cp mobile/android/app/build/outputs/bundle/release/app-release.aab mobile/artifacts/open-verse-mobile.aab
          fi
          cd mobile/artifacts
          sha256sum open-verse-mobile.apk > open-verse-mobile.apk.sha256
          sha256sum open-verse-mobile.aab > open-verse-mobile.aab.sha256
          cat open-verse-mobile.apk.sha256

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-verse-android-apk
          path: mobile/artifacts/open-verse-mobile.apk
          if-no-files-found: error

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: open-verse-android-aab
          path: mobile/artifacts/*.aab
          if-no-files-found: ignore

      - name: Publish to Latest Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for TAG in v0.2.0 desktop-latest; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" mobile/artifacts/open-verse-mobile.apk --clobber
              gh release upload "$TAG" mobile/artifacts/open-verse-mobile.apk.sha256 --clobber
              gh release upload "$TAG" mobile/artifacts/open-verse-mobile.aab --clobber
              gh release upload "$TAG" mobile/artifacts/open-verse-mobile.aab.sha256 --clobber
              echo "Uploaded release deliverables to $TAG"
            fi
          done
