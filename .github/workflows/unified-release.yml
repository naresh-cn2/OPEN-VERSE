name: Unified Cross-Platform Release

# Triggers when a version tag (e.g., v0.2.1) is pushed or manually dispatched
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.2.1)'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - stable
          - beta
          - nightly
        default: stable

permissions:
  contents: write
  packages: write

jobs:
  validate:
    name: 1. Validate Version Consistency & Test Suite
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
      tag: ${{ steps.extract_version.outputs.tag }}
      channel: ${{ steps.extract_version.outputs.channel }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract Release Version
        id: extract_version
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          CHANNEL="${{ github.event.inputs.channel || 'stable' }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$RAW_TAG" >> $GITHUB_OUTPUT
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "Preparing release v$VERSION on channel $CHANNEL"

      - name: Run Quality Gate & Regression Tests
        run: |
          bun install
          cd desktop/apps/examples/desktop-app
          bun install
          bunx vitest run webview/lib/open-verse-updater.test.ts webview/lib/open-verse-auth.test.ts --config vitest.config.ts
          cd ../../..
          bun run tests/e2e-cross-device-updater-repair.ts
          bun run tests/e2e-resilience-and-recovery.ts

  build-android:
    name: 2. Build Android APK & AAB
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Ensure Canonical Assets Synced
        run: |
          mkdir -p mobile/android/app/src/main/assets
          if [ -d "desktop/apps/examples/desktop-app/webview/out" ]; then
            cp -r desktop/apps/examples/desktop-app/webview/out/* mobile/android/app/src/main/assets/
          fi

      - name: Build Android Release APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Deliverables & Checksums
        run: |
          mkdir -p dist/android
          APK="mobile/android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "dist/android/open-verse-${{ needs.validate.outputs.tag }}-android.apk"
          cp "$APK" "dist/android/open-verse-mobile.apk"
          cd dist/android
          sha256sum open-verse-mobile.apk > open-verse-mobile.apk.sha256

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: dist/android/*
          if-no-files-found: error

  build-windows:
    name: 3. Build Windows Desktop Bundle
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust & Tauri
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Windows Desktop & Updater Artifacts
        shell: pwsh
        working-directory: desktop/apps/examples/desktop-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun install
          bun run build:runtime
          bun run build:web
          bunx tauri build --bundles nsis --config src-tauri/tauri.windows.conf.json --config src-tauri/tauri.release.conf.json

      - name: Generate latest.json Update Manifest
        shell: pwsh
        working-directory: desktop/apps/examples/desktop-app
        run: |
          $ver = "${{ needs.validate.outputs.version }}"
          $tag = "${{ needs.validate.outputs.tag }}"
          bun run scripts/generate-update-manifest.ts $ver $tag "OPEN-VERSE v$ver release with synchronized cross-platform support."

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-artifacts
          path: |
            desktop/apps/examples/desktop-app/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/apps/examples/desktop-app/src-tauri/target/release/bundle/nsis/*.nsis.zip
            desktop/apps/examples/desktop-app/src-tauri/target/release/bundle/nsis/*.sig
            desktop/apps/examples/desktop-app/src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error

  publish-unified-release:
    name: 4. Generate Unified Manifest & Publish Release
    needs: [validate, build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-artifacts
          path: release-deliverables/android

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-artifacts
          path: release-deliverables/windows

      - name: Verify All Critical Deliverables Present & Non-Empty
        run: |
          if [ ! -f "release-deliverables/android/open-verse-mobile.apk" ] || [ ! -s "release-deliverables/android/open-verse-mobile.apk" ]; then
            echo "❌ CRITICAL: Android APK missing or empty. Blocking publication."
            exit 1
          fi
          SETUP_EXE=$(find release-deliverables/windows -name "*setup.exe" | head -n 1)
          if [ -z "$SETUP_EXE" ] || [ ! -s "$SETUP_EXE" ]; then
            echo "❌ CRITICAL: Windows Setup Installer missing or empty. Blocking publication."
            exit 1
          fi
          if [ ! -f "release-deliverables/windows/latest.json" ]; then
            echo "❌ CRITICAL: Windows updater manifest (latest.json) missing. Blocking publication."
            exit 1
          fi
          echo "✅ All platform release deliverables verified and non-empty."

      - name: Generate Central Release Manifest
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          TAG="${{ needs.validate.outputs.tag }}"
          CHANNEL="${{ needs.validate.outputs.channel }}"
          SHA=$(sha256sum release-deliverables/android/open-verse-mobile.apk | cut -d ' ' -f 1)
          
          # Read Windows signature and filename from latest.json if available
          SIG=""
          if [ -f "release-deliverables/windows/latest.json" ]; then
            SIG=$(jq -r '.platforms["windows-x86_64"].signature // empty' release-deliverables/windows/latest.json)
          fi
          
          mkdir -p release-deliverables/manifests
          cat <<EOF > release-deliverables/manifests/open-verse-releases.json
          {
            "version": "$VERSION",
            "releaseDate": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "channel": "$CHANNEL",
            "mandatory": false,
            "releaseNotes": "• Native Android PackageInstaller Intent Bridge (v$VERSION / versionCode 5) with seamless in-app upgrade\n• In-app update check state fixes for instant detection across Android and Desktop\n• Desktop Tauri v$VERSION NSIS installer and signed updater bundle with Minisign cryptography",
            "platforms": {
              "android": {
                "version": "$VERSION",
                "versionCode": 5,
                "url": "https://open-verse-website.vercel.app/open-verse-mobile.apk",
                "sha256": "$SHA",
                "minSdk": 24
              },
              "windows-x86_64": {
                "version": "$VERSION",
                "url": "https://github.com/${{ github.repository }}/releases/download/$TAG/OPEN-VERSE_${VERSION}_x64-setup.exe",
                "signature": "$SIG"
              },
              "ios": {
                "version": "$VERSION",
                "build": "4",
                "testFlightUrl": "https://testflight.apple.com/join/openverse-preview"
              },
              "web": {
                "version": "$VERSION",
                "deployedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
              }
            }
          }
          EOF

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: "OPEN-VERSE v${{ needs.validate.outputs.version }}"
          files: |
            release-deliverables/android/*
            release-deliverables/windows/*
            release-deliverables/manifests/*
          prerelease: ${{ needs.validate.outputs.channel == 'beta' }}
          generate_release_notes: true

      - name: Update Rolling desktop-latest Release Feed
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: OPEN-VERSE Latest Desktop Feed
          body: "Rolling update feed and latest installer for OPEN-VERSE desktop applications."
          files: |
            release-deliverables/windows/*

