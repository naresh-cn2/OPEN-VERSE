name: Windows Hermes Agent Package

on:
  workflow_dispatch:
    inputs:
      confirm_build:
        description: 'Type "build" to build Hermes Agent Windows package.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Hermes Agent for Windows
    if: github.event.inputs.confirm_build == 'build'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: open-verse

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Copy Hermes Agent source
        shell: pwsh
        run: Copy-Item -Path "open-verse/sources/hermes-agent/*" -Destination "hermes-agent-pkg" -Recurse -Force

      - name: Install Hermes Agent dependencies
        shell: pwsh
        working-directory: hermes-agent-pkg
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -e .

      - name: Create Windows launcher scripts
        shell: pwsh
        working-directory: hermes-agent-pkg
        run: |
          New-Item -ItemType Directory -Path "bin" -Force | Out-Null
          '@echo off`nset HERMES_HOME=%~dp0`nset HERMES_PYTHON=%HERMES_HOME%\.venv\Scripts\python.exe`n"%HERMES_PYTHON%" "%HERMES_HOME%\cli.py" %*' | Out-File -FilePath "bin\hermes.bat" -Encoding ascii
          '@echo off`nset HERMES_HOME=%~dp0`nset HERMES_PYTHON=%HERMES_HOME%\.venv\Scripts\python.exe`n"%HERMES_PYTHON%" "%HERMES_HOME%\cli.py" gateway %*' | Out-File -FilePath "bin\hermes-gateway.bat" -Encoding ascii

      - name: Verify Hermes Agent installation
        shell: pwsh
        working-directory: hermes-agent-pkg
        run: |
          if (-not (Test-Path "cli.py")) { Write-Error "cli.py not found"; exit 1 }
          if (-not (Test-Path ".venv")) { Write-Error "venv not found"; exit 1 }
          Get-ChildItem -Path . | Select-Object Name

      - name: Package Hermes Agent ZIP
        shell: pwsh
        run: Compress-Archive -Path "hermes-agent-pkg\*" -DestinationPath "Hermes-Agent-0.2.8-windows.zip"

      - name: Upload Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-windows
          path: Hermes-Agent-0.2.8-windows.zip
          retention-days: 90
