<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>OPEN-VERSE Mobile</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%237c3aed'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <style>
      html, body {
        background-color: #09090b !important;
        color: #f4f4f5;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      #root {
        height: 100%;
        width: 100%;
      }
      .preloader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background: #09090b;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .preloader-icon {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(124, 58, 237, 0.25), rgba(79, 70, 229, 0.25));
        border: 1px solid rgba(139, 92, 246, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        box-shadow: 0 0 24px rgba(124, 58, 237, 0.2);
        animation: pulse-ring 2s infinite ease-in-out;
      }
      @keyframes pulse-ring {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.85; }
      }
      .preloader-title {
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: -0.025em;
        margin: 0 0 4px 0;
      }
      .preloader-subtitle {
        font-size: 11px;
        color: #a1a1aa;
        margin: 0;
      }
      .preloader-spinner {
        margin-top: 24px;
        width: 24px;
        height: 24px;
        border: 2px solid rgba(139, 92, 246, 0.2);
        border-top-color: #8b5cf6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .diagnostic-box {
        display: none;
        margin-top: 24px;
        max-width: 340px;
        width: 100%;
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 12px;
        padding: 14px;
        text-align: left;
        box-sizing: border-box;
      }
      .diagnostic-box.show {
        display: block;
      }
      .diagnostic-title {
        font-size: 11px;
        font-weight: 600;
        color: #fca5a5;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 6px;
      }
      .diagnostic-text {
        font-family: monospace;
        font-size: 10px;
        color: #fecaca;
        word-break: break-all;
        margin: 0 0 12px 0;
        line-height: 1.4;
      }
      .diagnostic-btn {
        display: inline-block;
        width: 100%;
        background: #7c3aed;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        text-align: center;
      }
    </style>
    <script>
      window.__OPEN_VERSE_DIAGNOSTICS__ = [];
      window.__showDiagnosticError = function(msg, src) {
        var box = document.getElementById('diag-box');
        var text = document.getElementById('diag-text');
        if (box && text) {
          box.classList.add('show');
          text.textContent = (msg || 'Unknown Script Error') + (src ? '\nLocation: ' + src : '');
        }
      };
      window.onerror = function(message, source, lineno, colno, error) {
        window.__showDiagnosticError(message, source + ':' + lineno + ':' + colno);
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event.reason;
        var msg = reason ? (reason.message || reason) : 'Unhandled Promise Rejection';
        window.__showDiagnosticError(msg, 'Promise');
      });
    </script>
  </head>
  <body class="bg-background text-zinc-100 antialiased select-none overflow-hidden touch-pan-y">
    <div id="root" class="h-screen w-screen flex flex-col">
      <!-- Pre-rendered native shell: smoothly replaced once React mounts -->
      <div class="preloader-container">
        <div class="preloader-icon">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1 class="preloader-title">OPEN-VERSE</h1>
        <p class="preloader-subtitle">Mobile Autonomous AI Studio</p>
        <div class="preloader-spinner"></div>

        <div id="diag-box" class="diagnostic-box">
          <div class="diagnostic-title">Startup Notice</div>
          <div id="diag-text" class="diagnostic-text"></div>
          <button class="diagnostic-btn" onclick="window.location.reload()">Reload Application</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
